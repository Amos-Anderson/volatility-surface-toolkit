[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "0.1.0"
description = "Volatility Surface Modelling Toolkit"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "matplotlib>=3.8",
    "seaborn>=0.13", "scikit-learn>=1.4", "torch>=2.2",
    "yfinance>=0.2.37", "structlog>=24.1", "plotly>=5.19", "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "mypy>=1.8", "black>=24.0", "ruff>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
